version: 2
updates:
  # Application dependencies (yarn workspaces, scanned at repo root).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  # GitHub Actions used by the forte-* workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels: ["ci"]

  # Immutable base-image digests used by the release and API v2 Dockerfiles.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    labels: ["docker", "dependencies"]

  - package-ecosystem: docker
    directory: "/apps/api/v2"
    schedule:
      interval: weekly
    labels: ["docker", "dependencies"]
