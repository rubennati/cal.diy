name: forte-codeql

# SAST for JavaScript/TypeScript. Results appear under Security → Code scanning.

on:
  pull_request:
    branches: [develop, release]
    # Skipping CodeQL on a pull request is safe only because it is not a required
    # status context on either branch — the sole required context is `ci`, so an
    # absent run cannot leave a PR indefinitely pending. The `push` and `schedule`
    # triggers below are deliberately unfiltered: release publication requires a
    # successful push-event CodeQL run for the exact SHA, and that evidence must
    # not depend on which paths a commit happened to touch.
    paths-ignore:
      - "**/*.md"
  push:
    branches: [develop, release]
  schedule:
    - cron: "17 4 * * 2"

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: github/codeql-action/init@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3
        with:
          category: "/language:javascript-typescript"
