name: forte-codeql

# SAST for JavaScript/TypeScript. Results appear under Security → Code scanning.

on:
  pull_request:
    branches: [develop, release]
  push:
    branches: [develop, release]
  schedule:
    - cron: "17 4 * * 2"

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3
        with:
          category: "/language:javascript-typescript"
