name: forte-trivy

# Dependency + secret + misconfig scanning (filesystem). Results appear under
# Security → Code scanning. Image-layer scanning of the GHCR release image can be
# added to the release-docker workflow as a pre-publish gate (planned for the release).

on:
  pull_request:
    branches: [develop, release]
  push:
    branches: [develop]
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

jobs:
  fs-scan:
    name: Trivy filesystem (vuln + secret + misconfig)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
