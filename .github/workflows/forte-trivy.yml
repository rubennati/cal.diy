name: forte-trivy

# Dependency + secret + misconfig scanning (filesystem). Results appear under
# Security → Code scanning. Image-layer scanning of the GHCR release image can be
# added to the release-docker workflow as a pre-publish gate (planned for the release).

on:
  pull_request:
    branches: [develop, release]
  push:
    branches: [develop, release]
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

jobs:
  fs-scan:
    name: Trivy filesystem (vuln + secret + misconfig)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
